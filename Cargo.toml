[package]
name = "railway"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["2d"] }
log = { version = "*", features = [
  "max_level_debug",
  "release_max_level_warn",
] }
bevy-inspector-egui = "0.38.0"

[features]
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
